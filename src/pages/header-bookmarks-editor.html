<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Header Bookmarks - AnimeStar Extension</title>
    <link rel="stylesheet" href="../styles/dark-theme.css">
    <link rel="stylesheet" href="../styles/extension-page.css">
    <link rel="stylesheet" href="../styles/user-card-buttons-editor.css">
    <link rel="stylesheet" href="../styles/header_bookmarks_bar.css">
    <link rel="stylesheet" href="../styles/awesome-pro-failed.css">
    <script src="../js/translation.js" type="module"></script>
    <script src="../js/dark-theme.js" type="module"></script>
    <style>
        .header-bookmarks-preview-wrap {
            display: flex;
            justify-content: center;
            padding: 12px 0;
        }
        .header-bookmarks-preview-wrap .as-ext-header-bookmarks {
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="settings-container">
        <translate-text>
            <h1 class="section-title">
                <i class="fas fa-bookmark"></i>
                <span>header_bookmarks_editor_title</span>
            </h1>

            <div class="preview-section">
                <h2>
                    <i class="fas fa-eye"></i>
                    <span>header_bookmarks_preview_title</span>
                </h2>
                <p class="preview-description">
                    <span>header_bookmarks_preview_description</span>
                </p>
                <div class="header-bookmarks-preview-wrap">
                    <div class="as-ext-header-bookmarks" id="header-bookmarks-preview">
                        <!-- Preview links -->
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h2>
                    <i class="fas fa-cog"></i>
                    <span>buttons_configuration</span>
                </h2>
                <div class="setting-item multi-line">
                    <div id="header-bookmarks-editor" class="buttons-editor"></div>
                </div>
                <div class="add-button-section">
                    <button class="add-custom-btn main-add-btn">
                        <i class="fas fa-plus"></i>
                        <span>add_button</span>
                    </button>
                </div>
                <div class="import-export-section">
                    <h3>
                        <i class="fas fa-exchange-alt"></i>
                        <span>import_export_config</span>
                    </h3>
                    <div class="import-export-buttons">
                        <button id="export-config">
                            <i class="fas fa-download"></i>
                            <span>export_config</span>
                        </button>
                        <button id="import-config">
                            <i class="fas fa-upload"></i>
                            <span>import_config</span>
                        </button>
                        <button id="reset-config">
                            <i class="fas fa-undo"></i>
                            <span>reset_to_default</span>
                        </button>
                    </div>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;">
                </div>
            </div>
        </translate-text>
    </div>
    <script src="../js/header-bookmarks-editor.js" type="module"></script>
</body>

</html>
